name: Update profile data

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: "profile-data"
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      HAS_LINKEDIN_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Fetch GitHub data
        run: bun run fetch:github
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Skip LinkedIn without a token
        if: env.HAS_LINKEDIN_TOKEN != 'true'
        run: echo "::notice::The LINKEDIN_ACCESS_TOKEN secret is not set. LinkedIn posts are skipped and existing data is kept."
      - name: Fetch LinkedIn posts
        if: env.HAS_LINKEDIN_TOKEN == 'true'
        continue-on-error: true
        run: bun run linkedin fetch --output-dir data
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_CLIENT_ID: ${{ secrets.LINKEDIN_CLIENT_ID }}
          LINKEDIN_CLIENT_SECRET: ${{ secrets.LINKEDIN_CLIENT_SECRET }}
      - name: Commit changed data
        id: commit
        run: |
          git add data
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update profile data"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy the new data
        if: steps.commit.outputs.changed == 'true'
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep the schedule enabled
        if: github.event_name == 'schedule'
        run: gh workflow enable data.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
